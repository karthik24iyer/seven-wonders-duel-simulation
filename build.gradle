plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
}

group = 'sevenwondersduel'
version = '0.1-SNAPSHOT'
description = 'SevenWondersDuel'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.vavr:vavr:0.9.2'
    implementation 'io.vavr:vavr-kotlin:0.9.2'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'javax.json:javax.json-api:1.1.2'
    implementation 'org.glassfish:javax.json:1.1.2'
    implementation 'org.json:json:20171018'
    implementation 'commons-cli:commons-cli:1.4'

    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.jetbrains.spek:spek-api:1.1.5'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testRuntimeOnly 'org.jetbrains.spek:spek-junit-platform-engine:1.1.5'
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// Terraforming Mars is half-finished and does not compile
sourceSets.main.kotlin.exclude '**/terraforming/*'

kotlin {
    jvmToolchain(21)
    compilerOptions.suppressWarnings = true
}

// `gradle installDist` lays out build/install/sevenwondersduel/{bin,lib} — use that
// classpath to run batches of games without paying Gradle startup per game.
application {
    mainClass = 'com.aigamelabs.swduel.Main'
}

// Dev conveniences: gradle swduel --args="-P1 MCTS -P2 Random -L logs/"
tasks.register('swduel', JavaExec) {
    mainClass = 'com.aigamelabs.swduel.Main'
    classpath = sourceSets.main.runtimeClasspath
}
tasks.register('myfish', JavaExec) {
    mainClass = 'com.aigamelabs.myfish.Main'
    classpath = sourceSets.main.runtimeClasspath
}
tasks.register('tictactoe', JavaExec) {
    mainClass = 'com.aigamelabs.tictactoe.Main'
    classpath = sourceSets.main.runtimeClasspath
}

// Web UI for running batches of games: gradle ui, then open http://localhost:8377
tasks.register('ui', JavaExec) {
    mainClass = 'com.aigamelabs.swduel.ui.Server'
    classpath = sourceSets.main.runtimeClasspath
}
